# Fig. 3-style Qiskit kickback-tomography (KT) circuit settings.
patch_sites: 14  # 11 or 14.
cultivated_state: Ty  # Ty or T.
injected_state: null  # null for a sweep; else one of: 0 1 + - i -i Y+ Y- S Sdg T Tdg Ty.
injection_angle_sweep: 42  # Google's Fig. 3 angles: 42 all, 11 dense near pi/4; null: one point.
preparations: [cultivation, injection_only]  # circuit sets per point; any distinct subset.
measure_encoder_flags: false  # true or false.
qed_cycle_indices: [1, 3, 4]  # any subset of [1, 2, 3, 4]; [1, 3, 4] keeps 14-site fault distance 3.
final_readout_basis: X  # X or Z: basis of the final destructive data readout.
add_barriers: true  # true or false.
