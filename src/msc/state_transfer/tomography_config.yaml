# Full-circuit Qiskit Ty tomography settings.
target_distance: 5
patch_sites: 14
# Supported schedules: hirano, minimal_z_only.
merge_schedule: hirano
full_post_selection: false
persistent_surface_x_post_selection: true
# Set true to measure and postselect the abstract-routed encoder flags (H8-H12).
# False (default) drops the enc_flags register and skips that postselection. For
# the default 14-site abstract-routed encoder this leaves the encoder+QED+
# cultivation circuit-level fault distance unchanged (verified at three).
measure_encoder_flags: false
# Set to null for the historical default: target_distance rounds, or one round
# when full_post_selection is enabled.
post_transfer_stabilizer_rounds: null
add_barriers: true
