# Qiskit Ty-state grafted-code memory experiment (Supplementary Fig. S22).
target_distance: 5
patch_sites: 14
merge_schedule: minimal_z_only  # Supported schedules: hirano, minimal_z_only.
full_post_selection: false
persistent_surface_x_post_selection: true
# Set true to measure and postselect the abstract-routed encoder flags (H8-H12).
# False (default) drops the enc_flags register and skips that postselection. For
# the default 14-site abstract-routed encoder this leaves the encoder+QED+
# cultivation circuit-level fault distance unchanged (verified at three).
measure_encoder_flags: false
# Measure the four 14-site cultivation ancilla flags (H8, H9, H11, H12). True
# keeps them; false (default) drops those measurements while keeping the folded
# root and its H10 root check. Only affects the 14-site patch; ignored for 11.
measure_cultivation_flags: false
# Post-injection Steane QED extent. 'minimal' (default) checks only the
# distance-three-certified subset Z_0145, X_0235, Z_0235; 'full' checks all six
# stabilizers. 'minimal' requires the 14-site patch.
post_injection_qed_checks: minimal
# Fit sqrt(<X_L>^2 + <Z_L>^2) over these post-transfer QEC round counts.
post_transfer_stabilizer_rounds: [1, 3, 5, 7, 9, 11, 13, 15]
add_barriers: true

